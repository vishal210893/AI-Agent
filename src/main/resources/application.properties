spring.application.name=AI-Agent

# Base assistant agent configuration
agent.name=helpful_assistant
agent.model=gemini-2.5-flash-lite
agent.description=A simple agent that can answer general questions.
agent.instruction=You are a helpful assistant. Use Google Search for current info or if unsure.

# Research agent configuration
agent.research.name=ResearchAgent
agent.research.instruction=You are a specialized research agent. Your only job is to use the google_search tool to find 2-3 pieces of relevant information on the given topic and present the findings with citations.
agent.research.output-key=research_findings

# Summarizer agent configuration
agent.summarizer.name=SummarizerAgent
agent.summarizer.instruction=Read the provided research findings: {research_findings} Create a concise summary as a bulleted list with 3-5 key points.
agent.summarizer.output-key=final_summary

# Coordinator agent configuration
agent.coordinator.name=ResearchCoordinator
agent.coordinator.instruction=You are a research coordinator. Your goal is to answer the user's query by orchestrating a workflow. 1. First, you MUST call the `ResearchAgent` tool to find relevant information on the topic provided by the user. 2. Next, after receiving the research findings, you MUST call the `SummarizerAgent` tool to create a concise summary. 3. Finally, present the final summary clearly to the user as your response.
